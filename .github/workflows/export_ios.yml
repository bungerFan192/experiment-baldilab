name: Export and Build iOS App

on:
  push:
    branches:
      - main
  workflow_dispatch: # Permite ejecutar el flujo manualmente desde GitHub

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Configurar la versión de Godot
      # Ajusta la versión según la que estés usando en tu proyecto
      - name: Setup Godot Engine
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1 # o 3.5.3 si trabajas en Godot 3
          use-dotnet: false
          include-templates: true
          
      # 3. Exportar el proyecto
      - name: Export Godot Project to Xcode
        run: |
          mkdir -p build/ios
          godot --headless --verbose --export-release "iOS" build/ios/experiment-baldilab.xcodeproj

      # 4. Configurar Xcode y seleccionar el SDK correcto
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # 5. Compilar el proyecto exportado usando xcodebuild
      - name: Build iOS App with Xcode
        run: |
          cd build/ios
          xcodebuild build \
            -project experiment-baldilab.xcodeproj \
            -scheme experiment-baldilab \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
            - name: Build iOS App with Xcode
        run: |
          cd build/ios
          xcodebuild build \
            -project experiment-baldilab.xcodeproj \
            -scheme experiment-baldilab \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # 5b. Empaquetar la app compilada en un archivo .ipa
      - name: Package App into .ipa
        run: |
          cd build/ios
          # Buscar la app compilada en la carpeta de Xcode DerivedData
          BUILD_APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "experiment-baldilab.app" | head -n 1)
          
          # Crear la estructura que requiere iOS
          mkdir -p Payload
          cp -r "$BUILD_APP_PATH" Payload/
          
          # Copiar el archivo .pck de Godot dentro del paquete .app
          cp experiment-baldilab.pck Payload/experiment-baldilab.app/
          
          # Comprimir la carpeta Payload en un archivo .ipa
          zip -r experiment-baldilab.ipa Payload

      # 6. Guardar el artefacto resultante en GitHub
     - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: experiment-baldilab-ipa
          path: build/ios/experiment-baldilab.ipa
