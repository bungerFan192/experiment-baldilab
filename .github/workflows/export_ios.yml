name: Export and Build iOS App

on:
  push:
    branches:
      - main
  workflow_dispatch: # Permite ejecutar el flujo manualmente desde GitHub

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Configurar la versión de Godot
      # Ajusta la versión según la que estés usando en tu proyecto
      - name: Setup Godot Engine
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1 # o 3.5.3 si trabajas en Godot 3
          use-dotnet: false
          
# 2. Descargar e instalar las plantillas de exportación oficiales de Godot 4.3.0
      - name: Download Godot Export Templates
        run: |
          GODOT_VERSION="4.3.0.stable"
          
          # Crear directorios según el nuevo estándar de Godot 4
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}
          
          # Descargar las plantillas desde el mirror oficial de GitHub
          curl -L -o export_templates.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          
          # Extraer forzando el nombre a .zip para unzip
          unzip -q export_templates.zip
          
          # Mover los archivos a la ruta esperada por Godot
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}/
          
          # Limpiar archivos temporales
          rm -rf templates export_templates.zip

      # 3. Exportar el proyecto
      - name: Export Godot Project to Xcode
        run: |
          mkdir -p build/ios
          godot --headless --export-release "iOS" build/ios/YourGame.xcodeproj

      # 4. Configurar Xcode y seleccionar el SDK correcto
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # 5. Compilar el proyecto exportado usando xcodebuild
      - name: Build iOS App with Xcode
        run: |
          cd build/ios
          xcodebuild build \
            -project YourGame.xcodeproj \
            -scheme YourGame \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      # 6. Guardar el artefacto resultante en GitHub
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/ios/
